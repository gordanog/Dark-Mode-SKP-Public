    <circle cx="821" cy="627" r="196" fill="#242424"/>
    <path id="crescent" fill="#E9B547" d="M820 487C747 507 706 582 724 650C744 725 827 765 897 733C923 721 944 701 957 677C909 704 849 693 812 650C773 604 777 537 820 487Z"/>
  </g>
